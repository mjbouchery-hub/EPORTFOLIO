<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieScope</title>
    <link rel="preconnect" href="https://www.omdbapi.com" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <!-- ========================
         HEADER / HERO
    ========================= -->
    <header class="site-header">
      <nav class="nav" aria-label="Primary navigation">
        <a class="logo" href="#" aria-label="MovieScope home">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 64 48" focusable="false">
              <path class="clapper-arm" d="M11 10 50 2l3 10-39 8z" />
              <path class="clapper-arm-cut" d="M20 8 27 6l7 9-7 2z" />
              <path class="clapper-arm-cut" d="M38 4 45 3l7 9-7 1z" />
              <path class="clapper-hinge" d="M9 17h10l-6 10H7z" />
              <path class="clapper-body" d="M10 21h44v22H10z" />
              <path class="clapper-top-row" d="M10 21h44v8H10z" />
              <path class="clapper-body-cut" d="M18 21h10l-7 8H11z" />
              <path class="clapper-body-cut" d="M38 21h10l-7 8H31z" />
            </svg>
          </span>
          <span>MovieScope</span>
        </a>
        <div class="nav-links">
          <a href="#results">Browse</a>
          <a href="#filters">Filters</a>
        </div>
      </nav>

      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">Search thousands of movies instantly.</p>
        <h1 id="hero-title">Discover your next movie</h1>
        <form class="search-form" id="search-form">
          <label class="sr-only" for="search-input">Search movie title</label>
          <input
            id="search-input"
            name="search"
            type="search"
            value="The Matrix"
            placeholder="Search by movie title..."
            autocomplete="off"
          />
          <button type="submit" aria-label="Search movies">
            <span aria-hidden="true">Search</span>
          </button>
        </form>
      </section>
    </header>

    <!-- ========================
         RESULTS / FILTERS
    ========================= -->
    <main>
      <section class="toolbar" id="filters" aria-label="Movie filters">
        <div>
          <p class="section-kicker">Results</p>
          <h2 id="results-heading">Search results</h2>
        </div>

        <label class="sort-control" for="sort-select">
          <span>Sort by</span>
          <select id="sort-select">
            <option value="relevance">Best match</option>
            <option value="rating-desc">Rating: high to low</option>
            <option value="rating-asc">Rating: low to high</option>
            <option value="date-desc">Release date: newest</option>
            <option value="date-asc">Release date: oldest</option>
          </select>
        </label>
      </section>

      <section
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      ></section>
      <section
        class="movie-grid"
        id="results"
        aria-label="Movie search results"
      ></section>
    </main>

    <!-- ========================
         FOOTER
    ========================= -->
    <footer class="footer">
      <p>Built with HTML, CSS, JavaScript, and the OMDb API.</p>
    </footer>
  </body>
</html>
