<svg width="470" height="96" viewBox="0 0 470 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Matthew Bouchery ePortfolio logo</title>
  <desc id="desc">A professional MB monogram with subtle engineering and systems motifs for a developer portfolio header.</desc>
  <defs>
    <linearGradient id="markGradient" x1="16" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="20" y1="24" x2="76" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="softShadow" x="8" y="8" width="88" height="88" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g id="logo">
    <g id="mb-mark" filter="url(#softShadow)">
      <path id="hex-frame" d="M48 10L79.18 28V68L48 86L16.82 68V28L48 10Z" fill="#0F172A"/>
      <path id="hex-edge" d="M48 10L79.18 28V68L48 86L16.82 68V28L48 10Z" stroke="url(#markGradient)" stroke-width="3" stroke-linejoin="round"/>
      <g id="circuit-motif" stroke="url(#accentGradient)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <path d="M24 29H32"/>
        <path d="M64 67H72"/>
        <path d="M67 35L72 30"/>
        <path d="M24 66L29 71"/>
        <circle cx="24" cy="29" r="2.5" fill="#93C5FD" stroke="none"/>
        <circle cx="72" cy="67" r="2.5" fill="#5EEAD4" stroke="none"/>
      </g>
      <g id="mb-monogram" stroke="#F8FAFC" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
        <path id="letter-m" d="M29 65V32L43.5 51L58 32V65"/>
        <path id="letter-b-stem" d="M58 32V65"/>
        <path id="letter-b-top" d="M58 34H66.5C72.2 34 75.5 37.6 75.5 42.2C75.5 46.9 72.2 50.4 66.5 50.4H58"/>
        <path id="letter-b-bottom" d="M58 50.4H67.8C74 50.4 77.6 54.2 77.6 59.4C77.6 64.4 74 68 67.8 68H58"/>
      </g>
    </g>
    <g id="wordmark" fill="#0F172A">
      <text id="name" x="112" y="47" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="750" letter-spacing="-0.7">Matthew Bouchery</text>
      <text id="descriptor" x="113" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650" letter-spacing="2.1" fill="#334155">Developer / Systems / Solutions</text>
    </g>
  </g>
</svg>
