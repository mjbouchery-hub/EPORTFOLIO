<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Premium Weather App</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #4facfe 0%, #00c6fb 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      transition: background 0.6s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    body.clear {
      background: linear-gradient(180deg, #4facfe 0%, #00c6fb 100%);
    }

    body.clouds {
      background: linear-gradient(180deg, #667db6 0%, #485563 100%);
    }

    body.rain {
      background: linear-gradient(180deg, #2c3e50 0%, #4ca1af 100%);
    }

    body.snow {
      background: linear-gradient(180deg, #8e9eab 0%, #eef2f3 100%);
      color: #1d1d1f;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 20px 18px 40px;
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
      opacity: 0.95;
    }

    .search-card,
    .weather-card,
    .details-grid,
    .hourly-section,
    .forecast-section {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    .search-card {
      padding: 14px;
      margin-bottom: 18px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: none;
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.14);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.65);
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 0 16px;
      background: rgba(255,255,255,0.16);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.22);
    }

    .weather-card {
      padding: 28px 22px;
      text-align: center;
      margin-bottom: 18px;
      animation: fadeUp 0.6s ease;
    }

    .location {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .date {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 18px;
    }

    .weather-icon {
      width: 110px;
      height: 110px;
    }

    .temp {
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
      margin: 8px 0;
    }

    .condition {
      font-size: 18px;
      text-transform: capitalize;
      opacity: 0.9;
    }

    .high-low {
      margin-top: 10px;
      font-size: 15px;
      opacity: 0.75;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .detail-card {
      background: rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 14px;
    }

    .detail-top {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.7;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .detail-value {
      font-size: 22px;
      font-weight: 600;
    }

    .hourly-section,
    .forecast-section {
      padding: 16px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 14px;
    }

    .hourly-scroll,
    .forecast-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
    }

    .hourly-scroll::-webkit-scrollbar,
    .forecast-scroll::-webkit-scrollbar {
      display: none;
    }

    .hour-card,
    .forecast-card {
      min-width: 80px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      scroll-snap-align: start;
    }

    .hour-card img,
    .forecast-card img {
      width: 42px;
      height: 42px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</head>
<body>
  <div class="app">
    <div class="status-bar">
      <span id="timeDisplay"></span>
      <span>Weather</span>
    </div>


<div class="search-card">
  <div class="search-row">
    <input type="text" id="city" placeholder="Search city">
    <button onclick="getWeather()">
      <span class="material-symbols-outlined">search</span>
    </button>
    <button onclick="getLocationWeather()">
      <span class="material-symbols-outlined">my_location</span>
    </button>
  </div>
</div>

<div class="loader" id="loader"></div>

<div id="currentWeather"></div>
<div id="details"></div>
<div id="hourly"></div>
<div id="forecast"></div>


  </div>

  <script>
    const apiKey = 'a5715512998ded88ef217ac85e84adf1';

    function updateClock() {
      const now = new Date();
      document.getElementById('timeDisplay').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    setInterval(updateClock, 1000);
    updateClock();

    function showLoader(show) {
      document.getElementById('loader').style.display = show ? 'block' : 'none';
    }

    function getWeather() {
      const city = document.getElementById('city').value;
      if (!city) return;

      const currentUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=imperial`;
      const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=imperial`;

      loadWeather(currentUrl, forecastUrl);
    }

    function getLocationWeather() {
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const currentUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=imperial`;
        const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=imperial`;

        loadWeather(currentUrl, forecastUrl);
      });
    }

    async function loadWeather(currentUrl, forecastUrl) {
      showLoader(true);

      const [currentRes, forecastRes] = await Promise.all([
        fetch(currentUrl),
        fetch(forecastUrl)
      ]);

      const current = await currentRes.json();
      const forecast = await forecastRes.json();

      showLoader(false);

      updateBackground(current.weather[0].main.toLowerCase());
      renderCurrent(current);
      renderDetails(current);
      renderHourly(forecast.list.slice(0, 8));
      renderForecast(forecast.list);
    }

    function updateBackground(weather) {
      document.body.className = '';

      if (weather.includes('clear')) document.body.classList.add('clear');
      else if (weather.includes('cloud')) document.body.classList.add('clouds');
      else if (weather.includes('rain')) document.body.classList.add('rain');
      else if (weather.includes('snow')) document.body.classList.add('snow');
    }

    function renderCurrent(data) {
      const sunrise = new Date(data.sys.sunrise * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const sunset = new Date(data.sys.sunset * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

      document.getElementById('currentWeather').innerHTML = `
        <div class="weather-card">
          <div class="location">${data.name}, ${data.sys.country}</div>
          <div class="date">${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}</div>
          <img class="weather-icon" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png">
          <div class="temp">${Math.round(data.main.temp)}&deg;</div>
          <div class="condition">${data.weather[0].description}</div>
          <div class="high-low">H:${Math.round(data.main.temp_max)}&deg;  L:${Math.round(data.main.temp_min)}&deg;</div>
          <div class="high-low">Sunrise ${sunrise} | Sunset ${sunset}</div>
        </div>
      `;
    }

    function renderDetails(data) {
      document.getElementById('details').innerHTML = `
        <div class="details-grid">
          <div class="detail-card">
            <div class="detail-top"><span class="material-symbols-outlined">thermostat</span>Feels Like</div>
            <div class="detail-value">${Math.round(data.main.feels_like)}°</div>
          </div>

          <div class="detail-card">
            <div class="detail-top"><span class="material-symbols-outlined">water_drop</span>Humidity</div>
            <div class="detail-value">${data.main.humidity}%</div>
          </div>

          <div class="detail-card">
            <div class="detail-top"><span class="material-symbols-outlined">air</span>Wind</div>
            <div class="detail-value">${Math.round(data.wind.speed)} mph</div>
          </div>

          <div class="detail-card">
            <div class="detail-top"><span class="material-symbols-outlined">visibility</span>Visibility</div>
            <div class="detail-value">${(data.visibility / 1609).toFixed(1)} mi</div>
          </div>
        </div>
      `;
    }

    function renderHourly(hours) {
      document.getElementById('hourly').innerHTML = `
        <div class="hourly-section">
          <div class="section-title">Hourly Forecast</div>
          <div class="hourly-scroll">
            ${hours.map(hour => `
              <div class="hour-card">
                <div>${new Date(hour.dt * 1000).toLocaleTimeString([], { hour: 'numeric' })}</div>
                <img src="https://openweathermap.org/img/wn/${hour.weather[0].icon}.png">
                <div>${Math.round(hour.main.temp)}&deg;</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderForecast(list) {
      const daily = {};

      list.forEach(item => {
        const date = item.dt_txt.split(' ')[0];

        if (!daily[date]) {
          daily[date] = {
            highs: [],
            lows: [],
            icon: item.weather[0].icon
          };
        }

        daily[date].highs.push(item.main.temp_max);
        daily[date].lows.push(item.main.temp_min);
      });

      document.getElementById('forecast').innerHTML = `
        <div class="forecast-section">
          <div class="section-title">5-Day Forecast</div>
          <div class="forecast-scroll">
            ${Object.keys(daily).slice(0, 5).map(date => {
              const day = daily[date];
              return `
                <div class="forecast-card">
                  <div>${new Date(date).toLocaleDateString([], { weekday: 'short' })}</div>
                  <img src="https://openweathermap.org/img/wn/${day.icon}.png">
                  <div>${Math.round(Math.max(...day.highs))}&deg;</div>
                  <div style="opacity:0.6">${Math.round(Math.min(...day.lows))}&deg;</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
